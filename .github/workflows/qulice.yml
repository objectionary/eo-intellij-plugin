---
# yamllint disable rule:line-length
name: qulice
'on':
  push:
    branches:
      - master
    paths:
      - '**.java'
      - '**/pom.xml'
      - '.github/workflows/qulice.yml'
  pull_request:
    branches:
      - master
    paths:
      - '**.java'
      - '**/pom.xml'
      - '.github/workflows/qulice.yml'
concurrency:
  group: qulice-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qulice:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - run: mvn com.qulice:qulice-maven-plugin:check
