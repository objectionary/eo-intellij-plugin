---
# yamllint disable rule:line-length
name: xcop
'on':
  push:
    branches:
      - master
    paths:
      - '**.xsl'
      - '**.xml'
      - '**.xhtml'
      - '**.html'
      - '**.xsd'
      - '.github/workflows/xcop.yml'
  pull_request:
    branches:
      - master
    paths:
      - '**.xsl'
      - '**.xml'
      - '**.xhtml'
      - '**.html'
      - '**.xsd'
      - '.github/workflows/xcop.yml'
concurrency:
  group: xcop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  xcop:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: g4s8/xcop-action@master
