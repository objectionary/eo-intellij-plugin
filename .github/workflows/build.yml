---
# yamllint disable rule:line-length
name: build
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        env:
          # see https://www.jetbrains.com/idea/download/previous.html
          # and https://www.jetbrains.com/intellij-repository/snapshots/
          - IDEA_VERSION: IC-2020.3
          - IDEA_VERSION: IC-2021.2.4
          - IDEA_VERSION: IC-2021.3.3
          - IDEA_VERSION: IC-2022.1.1
          - IDEA_VERSION: IU-LATEST-EAP-SNAPSHOT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
      - run: gradle wrapper; gradle build
        env: ${{ matrix.env }}
  telegram:
    needs: build
    runs-on: ubuntu-24.04
    if: ${{ always() && github.event_name == 'push' }}
    permissions:
      actions: read
    steps:
      - uses: yegor256/terald-action@6d5c4dab44d17afefa282df9bd7340185b8e93bc  # master
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat: -1004371404002
